schema_version: 1
workspace_id: "workspace:sample"
entities:
  - id: "session-context:sample"
    kind: "SESSION_CONTEXT"
    name: "Example session context"
projects:
  - id: "project:alpha"
    name: "Project Alpha"
  - id: "project:beta"
    name: "Project Beta"
repositories:
  - id: "repository:alpha-app"
    name: "Alpha App"
    path: "/Users/example/Develope/alpha-app"
    project: "project:alpha"
  - id: "repository:beta-app"
    name: "Beta App"
    path: "/Users/example/Develope/beta-app"
    project: "project:beta"
relations:
  - id: "rel:workspace-alpha"
    type: "contains"
    from: "workspace:sample"
    to: "project:alpha"
    axis: "logical"
    reason: "Explicit sample workspace membership"
  - id: "rel:workspace-beta"
    type: "contains"
    from: "workspace:sample"
    to: "project:beta"
    axis: "logical"
    reason: "Explicit sample workspace membership"
  - id: "rel:alpha-repository"
    type: "contains"
    from: "project:alpha"
    to: "repository:alpha-app"
    axis: "logical"
    reason: "Explicit sample project membership"
  - id: "rel:beta-repository"
    type: "contains"
    from: "project:beta"
    to: "repository:beta-app"
    axis: "logical"
    reason: "Explicit sample project membership"
  - id: "rel:context-workspace"
    type: "observes"
    from: "session-context:sample"
    to: "workspace:sample"
    axis: "session"
    reason: "Example session-axis relation; no authority implied"
