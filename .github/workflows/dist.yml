name: Distribution candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = "go$(cat .go-version)"
      - name: Build distribution candidates
        run: sh scripts/build-dist.sh
      - name: Verify archive set and checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'wsp_*.tar.gz' | wc -l)" -eq 4
          cd dist
          sha256sum -c SHA256SUMS
      - name: Smoke Linux amd64 binary
        run: |
          version=$(cat VERSION)
          mkdir -p /tmp/wsp-dist-smoke
          tar -C /tmp/wsp-dist-smoke -xzf "dist/wsp_${version}_linux_amd64.tar.gz"
          "/tmp/wsp-dist-smoke/wsp_${version}_linux_amd64/wsp" version
          "/tmp/wsp-dist-smoke/wsp_${version}_linux_amd64/wsp" doctor
      - name: Upload distribution candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsp-dist-candidate
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
