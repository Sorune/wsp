name: Product P0 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  selftest:
    name: ${{ matrix.os }} selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = "go$(cat .go-version)"
      - name: Normalize executable bits
        run: chmod +x bin/wsp tests/selftest.sh tests/conformance.sh
      - name: Bash syntax
        run: bash -n bin/wsp tests/selftest.sh tests/conformance.sh
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Product selftest
        run: bash tests/selftest.sh
